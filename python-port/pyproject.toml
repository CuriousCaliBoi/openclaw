[project]
name = "openclaw"
version = "0.1.0"
description = "Python port of OpenClaw – a personal AI assistant gateway for multi-channel messaging"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "click>=8.1.0",
    "python-telegram-bot>=21.0",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
all = ["anthropic>=0.40.0", "openai>=1.50.0"]

[project.scripts]
openclaw = "openclaw.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
